[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[project]
name = "running-ng"
version = "0.4.7"
description = "Running: Next Generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache"}
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Topic :: System :: Benchmark',
    'Programming Language :: Python :: 3',
]
authors = [{name = "Zixian Cai", email = "u5937495@anu.edu.au"}]
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[project.urls]
"Homepage" = "https://github.com/anupli/running-ng"
"Bug Tracker" = "https://github.com/anupli/running-ng/issues"

[project.optional-dependencies]
zulip = [
    "zulip~=0.9.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
running = "running.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15.12",
    "ty>=0.0.34",
    "types-PyYAML>=6.0.12.20260508",
    "zulip~=0.9.0",
]

[tool.uv.build-backend]
module-name = "running"
module-root = "src"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
